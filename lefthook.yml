pre-commit:
  parallel: false
  jobs:
    - name: Format staged frontend files
      glob: '*.{js,mjs,cjs,ts,jsx,tsx,json,css}'
      run: 'pnpm format {staged_files}'
      stage_fixed: true

    - name: Format Python files
      root: src/packages
      glob: '**/*.py'
      run: 'uvx ruff format {staged_files}'
      stage_fixed: true

    - name: Validate frontend files
      glob: '*.{js,mjs,cjs,ts,jsx,tsx}'
      run: 'pnpm exec oxlint {staged_files}'

    - name: Validate Python files
      root: src/packages
      glob: '**/*.py'
      run: 'uvx ruff check --fix {staged_files}'
      stage_fixed: true

commit-msg:
  jobs:
    - name: Validate commit message
      run: pnpm exec commitlint --edit $1

pre-push:
  parallel: false
  jobs:
    - name: Frontend type verification
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: 'pnpm typecheck'

    - name: Python verification
      root: src/packages
      glob: '**/*.py'
      exclude: 'experiments/**'
      run: 'uv run ruff format --check . && uv run ruff check . && uv run pyrefly check && uv run ty check'
