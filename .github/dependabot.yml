version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Maintain frontend dependencies
  - package-ecosystem: 'npm'
    directory: '/src/frontend'
    schedule:
      interval: 'weekly'
