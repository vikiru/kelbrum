name: Lint Files
run-name: Lint files using Oxlint
on:
  pull_request:
    branches:
      - main
      - dev

permissions: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
        with:
          version: 11.20.0
      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v6.8.1
        with:
          enable-cache: false
          python-version: '3.13'
      - name: Install Python dev dependencies
        run: uv --directory src/packages sync --all-packages --dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint files
        run: pnpm lint
      - name: Oxfmt formatting check
        run: pnpm exec oxfmt --check
      - name: Ruff lint
        run: uv --directory src/packages run ruff check .
      - name: Ruff formatting check
        run: uv --directory src/packages run ruff format --check .
      - name: Pyrefly type check
        run: uv --directory src/packages run pyrefly check
      - name: ty type check
        run: uv --directory src/packages run ty check
      - name: Python tests
        run: uv --directory src/packages run pytest -q tests/src/tests --tb=short
