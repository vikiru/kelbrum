name: Format Files
run-name: Format files using Oxfmt
on:
  push:
    branches:
      - main
      - dev
permissions: {}

concurrency:
    group: format-${{ github.ref }}
    cancel-in-progress: true
jobs:
    format:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - name: Setup github-actions[bot] git config
              run: |
                  git config --local user.name "github-actions[bot]"
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
              with:
                  version: 11.20.0
            - name: Setup uv
              uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v6.8.1
              with:
                  enable-cache: false
                  python-version: '3.13'
            - name: Install Python dev dependencies
              run: uv --directory src/packages sync --all-packages --dev
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Format files
              run: pnpm run format
            - name: Ruff formatting check
              run: uv --directory src/packages run ruff format .
            - name: Ruff lint
              run: uv --directory src/packages run ruff check .
            - name: Check for changes
              id: changes
              run: |
                  git add -A
                  if git diff --staged --quiet; then
                    echo "changes_exist=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  else
                    echo "changes_exist=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Output if changes exist
              env:
                  CHANGES_EXIST: ${{ steps.changes.outputs.changes_exist }}
              run: echo "$CHANGES_EXIST"
            - name: Commit formatting changes via GitHub Actions, if changes exist
              if: steps.changes.outputs.changes_exist == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |-
                  git commit -m "chore: format files via github actions"
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
