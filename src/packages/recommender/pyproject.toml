[project]
name = "recommender"
version = "0.1.0"
description = "Kelbrum recommender package"
requires-python = ">=3.13"
dependencies = [
  "anime-catalogue",
  "models",
  "features",
  "normalization",
  "config",
  "storage",
  "msgspec>=0.18",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
