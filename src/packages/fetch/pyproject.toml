[project]
name = "fetch"
version = "0.1.0"
description = "Kelbrum fetch package"
requires-python = ">=3.13"
dependencies = [
  "config",
  "storage",
  "msgspec>=0.18",
  "niquests>=3.15",
  "rich>=13.0",
  "orjson>=3.10",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
