[project]
name = "pipeline"
version = "0.1.0"
description = "Kelbrum pipeline package"
requires-python = ">=3.13"
dependencies = [
  "anime-catalogue",
  "config",
  "models",
  "storage",
  "processing",
  "normalization",
  "features",
  "recommender",
  "export",
  "fetch",
  "msgspec>=0.18",
  "numpy>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
