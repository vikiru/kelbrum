[project]
name = "kelbrum-tests"
version = "0.1.0"
description = "Dedicated Kelbrum unit and integration test suite"
requires-python = ">=3.13"
dependencies = [
  "export",
  "pipeline",
  "config",
  "models",
  "processing",
  "normalization",
  "features",
  "recommender",
  "numpy>=2.0",
  "polars>=1.0",
  "scipy>=1.14",
  "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
